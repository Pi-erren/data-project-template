[project]
name = "data-project-template"
version = "0.1.0"
description = "Template to start any data project with uv and Docker."
requires-python = ">=3.12"
dependencies = [
    "fastparquet>=2026.9.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.4",
    "numpy>=2.5.3",
    "pandas>=2.2",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
