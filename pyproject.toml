[project]
name = "data-project-template"
version = "0.1.0"
description = "Template to start any data project with uv and Docker."
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "fastparquet>=2026.9.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=2.2",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

